name: Production CD Pipeline

on:
  push:
    branches:
      - prod
    paths:
      - k8s/prod/app-deployment.yaml
      - .github/workflows/prod-cd.yaml
permissions:
    contents: write
    id-token: write
jobs:
# -------------------------- PROMOTE IMAGE TO PRODUCTION --------------------------
  promote-image-to-prod:
    name: Promote image to production
    runs-on: ubuntu-latest

    env:
      QA_IMAGE: awaismansha/nodejs-app:latest
      PROD_LATEST_IMAGE: awaismansha/nodejs-app:prod-${{ github.sha }}
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull image from QA
        run: docker pull ${{ env.QA_IMAGE }}
      - name: Tag image for production
        run: docker tag ${{ env.QA_IMAGE }} ${{ env.PROD_LATEST_IMAGE }}
      - name: Push image to production
        run: docker push ${{ env.PROD_LATEST_IMAGE }}

# -------------------------- UPDATE IMAGE IN PROD K8S MANIFEST --------------------------
  update-prod-k8s-manifest:
    name: Update image in prod K8S manifest
    runs-on: ubuntu-latest
    needs: promote-image-to-prod
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: prod
      - name: Update image in prod K8S manifest
        run: |
          sed -i "s|image: awaismansha/nodejs-app:.*|image: awaismansha/nodejs-app:prod-${{ github.sha }}|g" k8s/prod/app-deployment.yaml
      - name: Show updated prod K8S manifest
        run: cat k8s/prod/app-deployment.yaml
      - name: Commit and push changes
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/prod/app-deployment.yaml
            git commit -m "Update prod K8S manifest with new image tag prod-${{ github.sha }} [skip ci]"
            git push origin prod