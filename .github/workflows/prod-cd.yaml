name: Production CD Pipeline

on:
  push:
    branches:
      - prod
    paths:
      - k8s/prod/app-deployment.yaml
      - .github/workflows/prod-cd.yaml
permissions:
  contents: write
  id-token: write
jobs:
  # -------------------------- PROMOTE IMAGE TO PRODUCTION --------------------------
  promote-image-to-prod:
    name: Promote image to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa
          path: qa-branch

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read tested QA image and set prod image
        id: image
        run: |
          QA_IMAGE=$(grep -E 'image: .*nodejs-app:' qa-branch/k8s/qa/app-deployment.yaml | head -n 1 | awk '{print $2}')
          if [ -z "$QA_IMAGE" ]; then
            echo "No nodejs-app image found in QA manifest"
            exit 1
          fi
          QA_TAG="${QA_IMAGE##*:}"
          if [ "$QA_TAG" = "latest" ]; then
            echo "QA manifest still points at mutable latest; refusing production promotion"
            exit 1
          fi
          PROD_IMAGE="${QA_IMAGE%:*}:prod-${QA_TAG}"
          echo "qa=${QA_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "prod=${PROD_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "QA_IMAGE=${QA_IMAGE}" >> "$GITHUB_ENV"
          echo "PROD_IMAGE=${PROD_IMAGE}" >> "$GITHUB_ENV"

      - name: Pull image from QA
        run: docker pull "$QA_IMAGE"
      - name: Tag image for production
        run: docker tag "$QA_IMAGE" "$PROD_IMAGE"
      - name: Push image to production
        run: docker push "$PROD_IMAGE"

    outputs:
      prod_image: ${{ steps.image.outputs.prod }}

  # -------------------------- UPDATE IMAGE IN PROD K8S MANIFEST --------------------------
  update-prod-k8s-manifest:
    name: Update image in prod K8S manifest
    runs-on: ubuntu-latest
    needs: promote-image-to-prod
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: prod
      - name: Update image in prod K8S manifest
        run: |
          IMAGE=${{ needs.promote-image-to-prod.outputs.prod_image }}
          sed -i "s|image: .*nodejs-app:.*|image: ${IMAGE}|g" k8s/prod/app-deployment.yaml
      - name: Show updated prod K8S manifest
        run: cat k8s/prod/app-deployment.yaml
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/prod/app-deployment.yaml
          git commit -m "Promote tested QA image to prod [skip ci]"
          git push origin prod
