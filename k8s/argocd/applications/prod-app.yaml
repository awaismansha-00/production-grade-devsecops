apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-management-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: https://github.com/awaismansha-00/production-grade-devsecops.git
    targetRevision: prod
    path: k8s/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
