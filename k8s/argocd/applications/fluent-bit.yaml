apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://fluent.github.io/helm-charts
      chart: fluent-bit
      targetRevision: 0.49.0
      helm:
        releaseName: fluent-bit
        valueFiles:
          - $values/helm-values/logging/fluent-bit-values.yaml

    - repoURL: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true