apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-management-qa
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/awaismansha-00/production-grade-devsecops.git
    targetRevision: main
    path: k8s/qa

  destination:
    server: https://kubernetes.default.svc
    namespace: qa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true